# yaml-language-server: $schema=https://unpkg.com/zark/schema/entity.json

id: midi-controller
name: MIDI controller
kind: system
caption: Akai MPK Mini MK3
icon: lucide:piano
description: |
  The synth is built for the Akai MPK Mini MK3, but any device the browser
  lists through Web MIDI can be selected in the MIDI Manager card. MIDI is
  input only: the page reads midiAccess.inputs and never opens an output port
  or sends anything back (no clock, thru or SysEx), although it asks for SysEx
  permission when connecting. Notes 36-39 trigger the sampler pads while the
  Sampler module is present.
external: true

connections:
  - id: midi-in
    to: synth
    label: "Sends notes, CC and wheel data"
    technologies: [ web-midi ]
