server {
    listen ${PORT};
    root /usr/share/nginx/html;

    location = /robots.txt {
        types { }
        default_type text/plain;
    }

    location = /sitemap.xml {
        types { }
        default_type application/xml;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
